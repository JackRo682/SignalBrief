name: Public design validation tools
on:
  push:
    branches: [design/prelogin-pixel-match-20261005]
    paths: [.github/workflows/public-design-tools.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export tracked source for isolated visual validation
        run: git archive --format=tar.gz HEAD -o source.tar.gz
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Package the locked validation dependencies
        run: tar -czf node-tools.tar.gz -C apps/web node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: public-design-validation-tools
          path: |
            source.tar.gz
            node-tools.tar.gz
          retention-days: 1
