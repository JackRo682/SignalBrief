name: Workspace validation package
on:
  push:
    branches: [codex/workspace-pages-20261005]
    paths: [.github/workflows/workspace-validation-package.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Package source and dependencies without credentials
        run: |
          git archive --format=tar HEAD | gzip > workspace-source.tar.gz
          tar -czf workspace-node-tools.tar.gz -C apps/web node_modules
          sha256sum workspace-source.tar.gz workspace-node-tools.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-validation-input
          path: |
            workspace-source.tar.gz
            workspace-node-tools.tar.gz
            SHA256SUMS
          retention-days: 1
