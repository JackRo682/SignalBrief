name: OAuth origin audit
on:
  push:
    branches: [codex/navigation-auth-performance-20261004]
    paths: [.github/workflows/auth-origin-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only public origins and redirect destinations
        run: |
          python - <<'PY'
          import base64,json,urllib.request,urllib.error,urllib.parse
          SITE='https://signalbrief-beta.vercel.app'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          opener=urllib.request.build_opener(NoRedirect())
          def read(url,headers=None):
              try: r=opener.open(urllib.request.Request(url,headers=headers or {}),timeout=20)
              except urllib.error.HTTPError as e: r=e
              with r: return r.status,r.headers,r.read()
          _,_,raw=read(SITE+'/api/auth-config'); config=json.loads(raw)
          results=[]
          for origin in [SITE,'https://www.signalbrief.online','https://signalbrief.online']:
              status,headers,_=read(origin+'/login')
              auth_url=config['url']+'/auth/v1/authorize?provider=google&redirect_to='+urllib.parse.quote(origin+'/auth/callback',safe='')
              auth_status,auth_headers,_=read(auth_url,{'apikey':config['publishableKey']})
              location=urllib.parse.urlsplit(auth_headers.get('Location',''))
              params=urllib.parse.parse_qs(location.query)
              state=params.get('state',[''])[0]
              try:
                  segment=state.split('.')[1]; payload=json.loads(base64.urlsafe_b64decode(segment+'='*(-len(segment)%4)))
              except Exception: payload={}
              # Do not log OAuth state, codes, tokens, client IDs, public keys, or private data.
              results.append({'origin':origin,'page_status':status,'page_redirect':headers.get('Location'),
                  'authorize_status':auth_status,'provider_host':location.hostname,
                  'callback':params.get('redirect_uri'),
                  'returned_site_url':payload.get('site_url'),'returned_redirect_to':payload.get('redirect_to')})
          print(json.dumps(results,indent=2))
          PY
