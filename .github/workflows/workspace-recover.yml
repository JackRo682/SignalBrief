name: Recover workspace implementation
on:
  push:
    branches: [codex/workspace-pages-20261005]
    paths: [.github/workflows/workspace-recover.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive staged source for isolated review
        run: |
          mkdir -p /tmp/workspace-recovery
          git archive --format=tar HEAD | gzip > /tmp/workspace-recovery/branch-source.tar.gz
          cat .workspace-release/part0* | base64 --decode > /tmp/workspace-recovery/staged-source.tar.xz
          xz --test /tmp/workspace-recovery/staged-source.tar.xz
          sha256sum /tmp/workspace-recovery/*
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-recovery
          path: /tmp/workspace-recovery/
          retention-days: 2
