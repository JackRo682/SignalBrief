name: Review recovered workspace pages
on:
  push:
    branches: [codex/workspace-pages-20261005]
    paths: [.github/workflows/workspace-review.yml, '.workspace-release/review0*']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Recover exact implementation and reviewed fixes
        run: |
          cat .workspace-release/part0* | base64 -d | xz -d > /tmp/workspace.patch
          echo '3111bea4d1653c9aa22c3d3839f56fbffe131bf1e7f4f6b8a9df7f4f6346dc07  /tmp/workspace.patch' | sha256sum -c -
          git apply --check /tmp/workspace.patch
          git apply /tmp/workspace.patch
          cat .workspace-release/review0* | base64 -d | xz -d > /tmp/review.patch
          echo 'e365aaa625b3ff089084ee7fd009a0176386f1c64fa966c2244acb9ff5b268e3  /tmp/review.patch' | sha256sum -c -
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install and validate web
        working-directory: apps/web
        run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        working-directory: apps/web
        run: |
          NEXT_PUBLIC_API_URL=/api NEXT_PUBLIC_SUPABASE_URL=https://test-project.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_isolated_fixture setsid npm run dev -- --hostname 127.0.0.1 > /tmp/signalbrief-web.log 2>&1 &
          web_pid=$!
          trap 'kill -- -"$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/login > /dev/null
          npm run test:e2e -- performance.spec.ts auth-navigation.spec.ts marketing-pages.spec.ts ui-refinement.spec.ts responsive-design.spec.ts workspace-pages.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-review
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            /tmp/signalbrief-web.log
          retention-days: 3
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: test-only, POSTGRES_DB: workspace_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SB_TEST_WORKSPACE_POSTGRES_URL: postgresql+psycopg://postgres:test-only@localhost:5432/workspace_test
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Recover exact implementation and reviewed fixes
        run: |
          cat .workspace-release/part0* | base64 -d | xz -d > /tmp/workspace.patch
          echo '3111bea4d1653c9aa22c3d3839f56fbffe131bf1e7f4f6b8a9df7f4f6346dc07  /tmp/workspace.patch' | sha256sum -c -
          git apply --check /tmp/workspace.patch
          git apply /tmp/workspace.patch
          cat .workspace-release/review0* | base64 -d | xz -d > /tmp/review.patch
          echo 'e365aaa625b3ff089084ee7fd009a0176386f1c64fa966c2244acb9ff5b268e3  /tmp/review.patch' | sha256sum -c -
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: python -m ruff check apps/api tests scripts
      - run: python -m pytest -q --junitxml=workspace-reviewed-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-postgres-review
          path: workspace-reviewed-tests.xml
          retention-days: 3
