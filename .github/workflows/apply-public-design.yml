name: Apply and validate reviewed public design
on:
  push:
    branches: [design/prelogin-pixel-match-20261005]
    paths: [.github/workflows/apply-public-design.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the reviewed nineteen-file source change
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          encoded = ''.join(Path(f'.tools/public-design/part-{i:02d}.b64').read_text() for i in range(1, 5))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'cfb31ff9a4faf3fd27618c9c630d87a6ef5c495e7f8d34475cb2abcd01244c4e', 'Payload integrity mismatch'
          payload = json.loads(raw)
          files = payload['files']
          originals = payload['original_sha256']
          assert len(files) == 19 and set(files) == set(originals)
          for name, content in files.items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert name.startswith(('apps/web/src/', 'apps/web/e2e/')) or name == 'docs/PRELOGIN_DESIGN_2026-10-05.md'
              assert relative.suffix in ('.tsx', '.ts', '.css', '.md') and isinstance(content, str)
              path = Path(name)
              assert not path.is_symlink() and not any(parent.is_symlink() for parent in path.parents)
              expected = originals[name]
              if expected is None:
                  assert not path.exists(), f'New path already exists: {name}'
              else:
                  assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == expected, f'Source changed: {name}'
          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content.encode('utf-8'))
          Path('/tmp/public-design-paths').write_bytes(b'\0'.join(name.encode() for name in files) + b'\0')
          print('Verified provenance and applied all 19 reviewed files.')
          PY
      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint, typecheck, unit tests and production build
        working-directory: apps/web
        run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Commit only reviewed source paths to the design branch
        shell: bash
        run: |
          git diff --check
          git config user.name 'JackRo682'
          git config user.email '60928974+JackRo682@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/public-design-paths --pathspec-file-nul
          git commit -m 'feat(web): match all thirteen pre-login reference designs'
          git push origin HEAD:refs/heads/design/prelogin-pixel-match-20261005
