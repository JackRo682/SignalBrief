name: signalbrief-verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: python -m ruff check apps/api tests scripts
      - run: pytest -q --cov=signalbrief --cov-report=xml --junitxml=pytest.xml
      - run: python -m compileall -q apps/api tests scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            coverage.xml
            pytest.xml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - working-directory: apps/web
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Full repository release checks
        run: python scripts/verify.py --full
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Auth, public pages and progressive rendering on desktop and mobile
        working-directory: apps/web
        run: |
          NEXT_PUBLIC_API_URL=/api NEXT_PUBLIC_SUPABASE_URL=https://test-project.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_isolated_fixture setsid npm run dev -- --hostname 127.0.0.1 > /tmp/signalbrief-web.log 2>&1 &
          web_pid=$!
          trap 'kill -- -"$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/login > /dev/null
          npm run test:e2e -- performance.spec.ts auth-navigation.spec.ts marketing-pages.spec.ts ui-refinement.spec.ts responsive-design.spec.ts workspace-pages.spec.ts mobile-authenticated.spec.ts mobile-details.spec.ts career-analytics.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-performance-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            verification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-npm-lock
          path: apps/web/package-lock.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: test-only, POSTGRES_DB: signalbrief_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SB_TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only@localhost:5432/signalbrief_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: pytest -q -m postgres --junitxml=postgres-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-and-career-sql-results
          path: postgres-results.xml
