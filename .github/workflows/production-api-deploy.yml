name: Production API deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signalbrief-production-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xabzzhtdmqsaqdauthbu
    steps:
      - uses: actions/checkout@v4
      - name: Check the existing deployment credential without exposing it
        run: |
          if test -z "${SUPABASE_ACCESS_TOKEN:-}"; then
            echo 'Missing SUPABASE_ACCESS_TOKEN in the repository or Production environment.'
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno check --no-lock --config supabase/functions/signalbrief-api/deno.json supabase/functions/signalbrief-api/index.ts
      - name: Verify the existing function and preserve its gateway authentication policy
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/signalbrief-api" \
            -o /tmp/function-metadata.json
          jq -e '.slug == "signalbrief-api" and .verify_jwt == false' /tmp/function-metadata.json > /dev/null
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - name: Deploy the existing API only, with application Auth verification unchanged
        run: supabase functions deploy signalbrief-api --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
      - name: Read-only deployed API checks
        run: python scripts/check_hosted_api.py
      - name: Record the deployed source
        run: |
          echo "Deployed signalbrief-api from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
