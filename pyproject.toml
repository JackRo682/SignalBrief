[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalbrief"
version = "0.1.0"
description = "Evidence-first financial document intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.0,<0.129", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.45,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3", "pydantic-settings>=2.8,<3", "httpx>=0.28,<0.29",
  "PyJWT[crypto]>=2.10,<3", "beautifulsoup4>=4.13,<5", "defusedxml>=0.7,<1",
  "sentry-sdk[fastapi]>=2.20,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pytest-cov>=6,<8"]
[project.scripts]
signalbrief = "signalbrief.cli:main"
[tool.setuptools.packages.find]
where = ["apps/api"]
[tool.setuptools.package-data]
signalbrief = ["fixtures/*", "prompts/*.txt", "config/*.json"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: needs a real PostgreSQL test database"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
