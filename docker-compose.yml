# LOCAL SYNTHETIC DEMO ONLY. Do not expose these credentials or ports to the Internet.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: signalbrief
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: signalbrief
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalbrief"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: sh -c 'alembic upgrade head && exec uvicorn signalbrief.app:app --host 0.0.0.0 --port 8000'
    environment: &backend
      SB_ENVIRONMENT: development
      SB_DATABASE_URL: postgresql+psycopg://signalbrief:local-demo-password@db:5432/signalbrief
      SB_DEMO_MODE: 'true'
      SB_DEMO_ADMIN: 'false'
      SB_AUTH_MODE: demo
      SB_STORAGE_MODE: local
      SB_STORAGE_PATH: /app/var/raw
      SB_ALLOWED_HOSTS: localhost,127.0.0.1,api
      SB_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes: ["raw-data:/app/var/raw"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build: .
    command: python -m signalbrief.cli worker
    environment: *backend
    volumes: ["raw-data:/app/var/raw"]
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  raw-data:
