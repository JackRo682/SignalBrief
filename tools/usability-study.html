<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalBrief 근거 확인 사용성 실험</title>
<style>body{font:17px/1.7 system-ui,sans-serif;background:#f5f6f8;color:#172435;max-width:900px;margin:40px auto;padding:0 24px}section{background:white;border:1px solid #d4dce5;padding:28px;margin:20px 0;border-radius:12px}h1{font-size:30px;line-height:1.3}h2{font-size:22px}button{font:inherit;border:0;border-radius:6px;background:#163c64;color:white;padding:10px 18px;cursor:pointer;margin:6px}button:disabled{opacity:.45}input,select{font:inherit;padding:8px;margin:6px}label{display:block}pre{white-space:pre-wrap;font:inherit}.muted{color:#50657c;font-size:14px}a{color:#175eb5}</style>
<h1>공시의 변화와 근거를 확인해 주세요</h1>
<p>사용성 실험용 화면입니다. 투자 판단을 요청하지 않습니다. 응답은 브라우저 메모리에만 저장되며, 진행자가 내보낼 때 파일로 생성됩니다.</p>
<section id="setup"><h2>실험 준비</h2>
<p class="muted">진행자: 검수한 A/C 실험 결과로 만든 stimuli JSON을 불러오세요. 실제 AI 출력이 없으면 참가자 실험을 시작하지 않습니다.</p>
<input id="file" type="file" accept="application/json">
<label><input id="consent" type="checkbox">익명 실험 기록 수집에 동의합니다. 이름, 이메일, 보유종목, 자유 서술은 수집하지 않습니다.</label>
<button id="start" disabled>시작</button><button id="withdraw">동의 철회 및 기록 삭제</button><p id="status" role="status"></p></section>
<section id="trial" hidden><h2 id="title"></h2><pre id="brief"></pre><div id="evidence"></div>
<p id="task"></p>
<label>변화 방향 <select id="direction"><option value="">선택</option><option value="increased">증가</option><option value="decreased">감소</option><option value="unchanged">동일</option><option value="insufficient">근거 부족</option></select></label>
<label>비교 기간 <select id="period"><option value="">선택</option><option value="year_over_year">전년 동기</option><option value="quarter_over_quarter">전분기</option><option value="incomparable">비교 불가</option></select></label>
<label>판단 확신 <select id="confidence"><option value="">선택</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
<button id="complete">응답 제출</button></section>
<button id="export" disabled>익명 기록 내보내기</button>
<script>
'use strict';
const $=id=>document.getElementById(id);
let stimuli=null, events=[], participant=null, order=[], index=0, started=0, seen=new Set(), active=false;
function record(name,properties){if(!$('consent').checked||!participant)return;const key=name+':'+index;if(name!=='evidence_opened'&&seen.has(key))return;seen.add(key);events.push({event_id:crypto.randomUUID(),participant_id:participant,event_name:name,trial_index:index,condition:order[index]||null,elapsed_ms:Math.max(0,Math.round(performance.now()-started)),properties});}
function ready(){$('start').disabled=!stimuli||!$('consent').checked||active;}
function withdraw(){events=[];seen.clear();participant=null;active=false;$('consent').checked=false;$('trial').hidden=true;$('export').disabled=true;$('status').textContent='동의를 철회하고 브라우저 메모리의 실험 기록을 삭제했습니다. 이미 내보낸 파일의 삭제는 진행자에게 요청해 주세요.';ready();}
$('consent').onchange=()=>{if(!$('consent').checked)withdraw();else ready();};$('withdraw').onclick=withdraw;
$('file').onchange=async()=>{try{const file=$('file').files[0];if(file.size>100000)throw Error();const x=JSON.parse(await file.text());if(x.version!=='signalbrief-usability-v1'||x.human_review_status!=='approved'||!x.reviewer||!x.review_date||!x.model_run_reference||!Array.isArray(x.trials)||x.trials.length!==2)throw Error();for(const t of x.trials){if(!/^T[12]$/.test(t.id)||!t.generic||!t.evidence_first||!t.task||!Array.isArray(t.sources))throw Error();for(const s of t.sources){const u=new URL(s.url);if(u.protocol!=='https:'||u.hostname!=='www.sec.gov'||!u.pathname.startsWith('/Archives/edgar/data/')||u.username||u.password)throw Error();}}stimuli=x;$('status').textContent='검수 표시가 있는 자료를 불러왔습니다. 표시는 진행자가 확인해야 합니다.';}catch{stimuli=null;$('status').textContent='자료 형식이나 출처가 맞지 않습니다. 검수된 stimuli JSON이 필요합니다.';}ready();};
function show(){if(index>=2){active=false;$('trial').hidden=true;$('status').textContent='완료했습니다. 진행자에게 기록을 전달해 주세요.';$('export').disabled=false;return;}const t=stimuli.trials[index];const condition=order[index];$('trial').hidden=false;$('title').textContent=`자료 ${index+1}`;$('brief').textContent=condition==='generic'?t.generic:t.evidence_first;$('task').textContent=t.task;$('evidence').replaceChildren();if(condition==='evidence'){for(const s of t.sources){const a=document.createElement('a');a.href=s.url;a.textContent=s.label;a.target='_blank';a.rel='noopener noreferrer';a.onclick=()=>record('evidence_opened',{source_index:t.sources.indexOf(s)});const p=document.createElement('p');p.append(a);$('evidence').append(p);}}for(const id of ['direction','period','confidence'])$(id).value='';started=performance.now();record('trial_started',{task_id:t.id});}
$('start').onclick=()=>{if(!stimuli||!$('consent').checked||active)return;participant=crypto.randomUUID();events=[];seen.clear();index=0;active=true;order=crypto.getRandomValues(new Uint8Array(1))[0]%2?['generic','evidence']:['evidence','generic'];$('start').disabled=true;show();};
$('complete').onclick=()=>{if(!active||!$('consent').checked)return;if(['direction','period','confidence'].some(id=>!$(id).value)){$('status').textContent='모든 항목을 선택해 주세요.';return;}record('trial_completed',{task_id:stimuli.trials[index].id,direction:$('direction').value,period:$('period').value,confidence:Number($('confidence').value)});index++;show();};
$('export').onclick=()=>{if(!$('consent').checked||!participant||active)return;const blob=new Blob([JSON.stringify({schema:'signalbrief-usability-v1',kind:'participant_response_not_automatically_scored',stimulus_run:stimuli.model_run_reference,events},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='signalbrief-study-'+participant+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script></html>
